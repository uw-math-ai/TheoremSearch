[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "premise-rl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rapidfuzz>=3.9.0",
    "diskcache>=5.6.0",
    "pyyaml>=6.0.1",
    "openai>=1.50.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: marks tests requiring external services (DB, TheoremSearch API, OpenAI)",
]
